[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permitunified"
version = "0.0.1"
description = "Единый генератор пропусков 14.3 / 14.5 / 19.17.1"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-docx>=1.1.0",
    "tkcalendar>=1.6.1",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["permitunified*"]